<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Una mano a mamma</title>
<meta name="description" content="Una mano a mamma, una mano a papà: la canzone del primo giorno di scuola, con le parole che scorrono e il karaoke.">
<meta property="og:type" content="website">
<meta property="og:locale" content="it_IT">
<meta property="og:site_name" content="Una mano a mamma">
<meta property="og:title" content="Una mano a mamma – passi grandi, zaino in spalla!">
<meta property="og:description" content="La canzone con le parole che scorrono, e il karaoke per cantarla tu.">
<meta property="og:image" content="https://pxh2407.github.io/una-mano-a-mamma/anteprima-v2.jpg">
<meta property="og:image:secure_url" content="https://pxh2407.github.io/una-mano-a-mamma/anteprima-v2.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Una mano a mamma: disegno a pastelli con lo zaino">
<meta property="og:image:type" content="image/jpeg">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root { --carta: #fff8e7; --blu: #1d3557; --rosso: #d62828; --arancio: #ff9614; --verde: #3c9646; --azzurro: #288cd2; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; background: var(--carta); color: var(--blu);
         font-family: "Segoe UI", system-ui, Arial, sans-serif;
         display: flex; flex-direction: column; align-items: center; padding: 28px 16px 40px; }
  h1 { font-family: "Segoe Print", "Comic Sans MS", cursive; font-size: clamp(38px, 9vw, 64px);
       line-height: 1.2; text-align: center; }
  h1 span:nth-child(4n+1) { color: var(--rosso); } h1 span:nth-child(4n+2) { color: var(--arancio); }
  h1 span:nth-child(4n+3) { color: var(--verde); } h1 span:nth-child(4n) { color: var(--azzurro); }
  .sotto { font-family: "Segoe Print", "Comic Sans MS", cursive; font-size: clamp(20px, 5vw, 28px); margin: 6px 0 20px; text-align: center; }
  img { width: 100%; max-width: 420px; border: 8px solid var(--blu); border-radius: 16px;
        box-shadow: 8px 10px 0 #e1d4b9; }
  .scelte { display: flex; flex-direction: column; gap: 18px; width: 100%; max-width: 460px; margin-top: 28px; }
  a.scelta { display: block; text-decoration: none; text-align: center; border-radius: 16px; padding: 18px 20px;
             font-size: 26px; font-weight: 700; border: 3px solid var(--blu); box-shadow: 0 6px 0 var(--blu); }
  a.scelta small { display: block; font-size: 18px; font-weight: 400; margin-top: 4px; }
  a.scelta:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--blu); }
  .voce { background: var(--arancio); color: var(--blu); }
  .karaoke { background: var(--blu); color: #fff; }
  .galleria { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; max-width: 460px; margin-top: 30px; }
  .galleria img { width: 100%; border-width: 3px; border-radius: 8px; box-shadow: none; cursor: pointer; }
</style>
</head>
<body>
  <h1 id="titolo">Una mano a&nbsp;mamma</h1>
  <p class="sotto">Passi grandi, zaino in&nbsp;spalla!</p>
  <img id="grande" src="disegno-v1.jpg" alt="Disegno a pastelli: uno zaino arancione su un viale alberato, il sole e una porta rossa">
  <div class="scelte">
    <a class="scelta voce" href="voce.html">▶ La canzone<small>con la voce e le parole che scorrono</small></a>
    <a class="scelta karaoke" href="karaoke.html">🎤 Karaoke<small>solo musica: canta tu!</small></a>
  </div>
  <!-- le immagini del video: toccandone una diventa grande in alto -->
  <div class="galleria">
    <img src="disegno-01-scarpe-v1.jpg" alt="Scarpette nuove coi lacci: il gran giorno!">
    <img src="disegno-00-zaino-v1.jpg" alt="Disegno a pastelli: lo zaino nel viale alberato">
    <img src="disegno-02-campana-v1.jpg" alt="Il gioco della campana col gesso">
    <img src="disegno-03-cuori-v1.jpg" alt="Due cuori grandi e uno piccolo: colme di tenerezza">
    <img src="disegno-04-aeroplano-v1.jpg" alt="Aeroplanino di carta: si va!">
    <img src="disegno-05-famiglia-v1.jpg" alt="Mamma, bimbo e papà mano nella mano">
    <img src="disegno-06-stereo-v1.jpg" alt="Lo stereo con le note: uno, due e tre, hip hop!">
    <img src="disegno-07-goccia-v1.jpg" alt="Una lacrimuccia di gioia accanto a un cuore">
    <img src="disegno-08-scuola-v1.jpg" alt="La scuola con la bandiera">
    <img src="disegno-09-gradini-v1.jpg" alt="I gradini colorati verso la porta: buon viaggio!">
    <img src="disegno-10-strada-v1.jpg" alt="La strada verso l'arcobaleno: il futuro comincia adesso!">
  </div>
<script>
  // ogni lettera del titolo di un colore diverso, come i bambini
  const t = document.getElementById("titolo");
  t.innerHTML = [...t.textContent].map(c => c === " " ? " " : "<span>" + c + "</span>").join("");
  const g = document.getElementById("grande");
  document.querySelectorAll(".galleria img").forEach(i => i.onclick = () => {
    g.src = i.src; g.alt = i.alt; g.scrollIntoView({ behavior: "smooth", block: "center" });
  });
</script>
</body>
</html>
